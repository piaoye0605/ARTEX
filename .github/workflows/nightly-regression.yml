name: nightly-regression

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京时间 02:00
  workflow_dispatch: {} # 支持手动触发（首跑验证用）

jobs:
  go:
    name: Go 闸门（vet + 全量测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -coverprofile=cover.out
      - name: 覆盖率门禁
        if: always() && hashFiles('cover.out') != ''
        run: ARTEX_COV_SUMMARY="$GITHUB_STEP_SUMMARY" bash ./cov.sh -r -o cover.out
      - name: 上传覆盖率
        if: always() && hashFiles('cover.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: cover.out
          retention-days: 14

  race:
    name: 竞态抽查（-race）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # server 包带 -race 太慢（>20min），这里只抽查并发密集的库与工具。
      - name: race
        run: go test -race -count=1 -timeout 900s ./agent/... ./db/... ./report/... ./enrich/... ./traffic/... ./tools/...

  web:
    name: 前端闸门（install + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # biome check 暂不进 CI：当前 134 errors（P4 第 1 步清完 lint 债后再加回）
